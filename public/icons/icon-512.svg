<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- Gradient Squircle Base (Transparent Background) -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad512)" />

  <!-- Stylized Vinyl Record Disc3 Element -->
  <g stroke="#ffffff" stroke-linecap="round" fill="none">
    <!-- Outer Vinyl Rim -->
    <circle cx="256" cy="256" r="160" stroke-opacity="0.95" stroke-width="20" />
    
    <!-- Inner Vinyl Grooves -->
    <path d="M256 150 A106 106 0 0 1 362 256" stroke-opacity="0.65" stroke-width="14" />
    <path d="M256 362 A106 106 0 0 1 150 256" stroke-opacity="0.65" stroke-width="14" />

    <!-- Center Label Ring -->
    <circle cx="256" cy="256" r="52" stroke-opacity="0.95" stroke-width="16" />
  </g>

  <!-- Center Spindle Dot -->
  <circle cx="256" cy="256" r="18" fill="#ffffff" />
</svg>
