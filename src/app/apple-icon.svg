<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGradApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- Gradient Squircle Base (Transparent Background) -->
  <rect width="192" height="192" rx="45" fill="url(#bgGradApple)" />

  <!-- Stylized Vinyl Record Disc3 Element -->
  <g stroke="#ffffff" stroke-linecap="round" fill="none">
    <!-- Outer Vinyl Rim -->
    <circle cx="96" cy="96" r="60" stroke-opacity="0.95" stroke-width="7.5" />
    
    <!-- Inner Vinyl Grooves -->
    <path d="M96 56 A40 40 0 0 1 136 96" stroke-opacity="0.65" stroke-width="5.5" />
    <path d="M96 136 A40 40 0 0 1 56 96" stroke-opacity="0.65" stroke-width="5.5" />

    <!-- Center Label Ring -->
    <circle cx="96" cy="96" r="19.5" stroke-opacity="0.95" stroke-width="6" />
  </g>

  <!-- Center Spindle Dot -->
  <circle cx="96" cy="96" r="6.75" fill="#ffffff" />
</svg>
